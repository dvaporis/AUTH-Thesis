[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-phoneme-pipeline"
version = "0.1.0"
description = "Utilities for the GRID visual phoneme prediction pipeline"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["grid_phoneme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
